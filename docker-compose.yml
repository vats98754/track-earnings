version: "3.9"
services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: te_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: valuation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: te_redis
    ports:
      - "6379:6379"
volumes:
  pgdata: {}
